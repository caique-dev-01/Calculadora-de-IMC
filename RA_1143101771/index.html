<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de IMC</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow">
      <div class="card-body">
        <h1 class="text-center mb-4">Calculadora de IMC</h1>

        <form id="formulario" class="row g-3 mb-4">
          <div class="col-md-4">
            <input type="text" id="nome" class="form-control" placeholder="Nome" required />
          </div>
          <div class="col-md-3">
            <input type="number" id="peso" class="form-control" placeholder="Peso (kg)" step="0.1" required />
          </div>
          <div class="col-md-3">
            <input type="number" id="altura" class="form-control" placeholder="Altura (m)" step="0.01" required />
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-success">Adicionar</button>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-bordered table-striped text-center">
            <thead class="table-success">
              <tr>
                <th>Nome</th>
                <th>Peso (kg)</th>
                <th>Altura (m)</th>
                <th>IMC</th>
                <th>Classificação</th>
              </tr>
            </thead>
            <tbody id="tabelaCorpo">
              <!-- Linhas atraves do JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
